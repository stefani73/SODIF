[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sodif"
version = "0.21.0"
description = "SODIF cybersecurity platform for document-authorized execution control"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary — third-party dependencies remain under their OSS licenses" }
authors = [
  { name = "SODIF Project Team" },
]
dependencies = [
  "cryptography>=45,<48",
  "pymupdf>=1.26,<2",
  "pydantic>=2.10,<3",
  "pypdf>=6,<7",
  "python-docx>=1.2,<2",
  "rfc8785>=0.1,<1",
  "streamlit[pdf]>=1.40,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
sodif-app = "sodif.app:main"
sodif-flight = "sodif.demo.cli:main"
sodif-export = "sodif.reporting.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --cov=sodif --cov-branch --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["sodif"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "class .*\\bProtocol\\):",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
ignore_missing_imports = true
mypy_path = "src"
